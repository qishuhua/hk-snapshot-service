<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>监控截图</title>
<style>
:root{font-family:Inter,"Microsoft YaHei",sans-serif;color:#e9eff8;background:#101722;color-scheme:dark}*{box-sizing:border-box}body{margin:0}header{border-bottom:1px solid #2b394b;background:#151f2d}.top{max-width:1240px;margin:auto;padding:20px 28px;display:flex;align-items:center;gap:13px}.mark{display:grid;place-items:center;background:#27b59c;color:#09251f;width:38px;height:38px;border-radius:10px;font-weight:800;font-size:21px}.top strong{font-size:19px}.top small{display:block;color:#a2b2c6;margin-top:3px;font-size:13px}main{max-width:1240px;margin:auto;padding:38px 28px 54px}.heading{margin-bottom:28px}.heading h1{font-size:27px;margin:0 0 8px}.heading p{color:#a2b2c6;margin:0;line-height:1.6}.layout{display:grid;grid-template-columns:390px minmax(0,1fr);gap:22px}.panel{background:#192536;border:1px solid #304156;border-radius:14px;padding:24px}.panel h2{font-size:18px;margin:0 0 6px}.sub{color:#a2b2c6;font-size:14px;line-height:1.6;margin:0 0 22px}.grid{display:grid;grid-template-columns:1fr 100px;gap:14px}.field{margin-bottom:16px}.field label,.label{display:block;font-size:14px;font-weight:600;margin-bottom:8px;color:#dbe6f3}input{font:inherit;font-size:15px;width:100%;background:#101b29;border:1px solid #43546a;color:#f1f6ff;border-radius:8px;padding:11px 12px;min-width:0}input:focus{outline:2px solid #40c7af;outline-offset:1px}input::placeholder{color:#8394a9}.modes{display:flex;gap:8px;padding:4px;background:#101b29;border-radius:9px;margin-bottom:20px}.modes label{flex:1;text-align:center;padding:9px;border-radius:7px;cursor:pointer;color:#b2c0d1;font-size:15px}.modes label:has(input:checked){background:#30485a;color:#f3fffc}.modes input{position:absolute;opacity:0;width:1px}.modes label:has(input:focus-visible){outline:2px solid #40c7af}button,.download{font:inherit;font-weight:700;border:0;border-radius:8px;padding:12px 18px;cursor:pointer}button.primary{width:100%;background:#4ad2b7;color:#092a25}button:disabled{opacity:.6;cursor:wait}.preview{display:flex;flex-direction:column;min-height:570px}.preview-head{display:flex;justify-content:space-between;gap:12px;align-items:start}.download{background:#304156;color:#edf5ff;text-decoration:none;font-size:14px}.download[hidden], [hidden]{display:none!important}.canvas{flex:1;min-height:330px;border:1px dashed #405368;border-radius:10px;background:#101a27;display:grid;place-items:center;overflow:hidden;text-align:center}.empty{color:#a2b2c6;padding:24px}.icon{font-size:38px;color:#6c869f;margin-bottom:12px}.empty strong{display:block;color:#d7e2ed;margin-bottom:7px}.canvas img{display:block;width:100%;max-height:650px;object-fit:contain}.status{min-height:24px;margin:15px 0 0;color:#9cb0c3;font-size:14px;line-height:1.5;overflow-wrap:anywhere}.status.error{color:#ff9d9d}.status.success{color:#6ee1c8}.note{font-size:13px;color:#a2b2c6;line-height:1.6;margin:14px 0 0}@media(max-width:780px){main{padding:28px 16px}.top{padding:16px}.layout{grid-template-columns:1fr}.preview{min-height:440px}.panel{padding:20px}}
</style>
</head>
<body>
<header><div class="top"><div class="mark">◉</div><div><strong>监控截图</strong><small>NVR 截图工作台</small></div></div></header>
<main><div class="heading"><h1>获取监控画面</h1><p>连接海康 NVR，获取当前画面或指定时刻的历史画面。</p></div>
<div class="layout"><section class="panel"><h2>截图设置</h2><p class="sub">填写设备信息，选择截图时间。</p>
<form id="form"><span class="label">截图模式</span><div class="modes"><label><input type="radio" name="mode" value="realtime" checked>实时截图</label><label><input type="radio" name="mode" value="history">历史截图</label></div>
<div class="grid"><div class="field"><label for="host">设备地址</label><input id="host" required placeholder="例如 192.168.1.64" autocomplete="off"></div><div class="field"><label for="port">SDK 端口</label><input id="port" type="number" min="1" max="65535" value="8000" required></div></div>
<div class="grid"><div class="field"><label for="username">用户名</label><input id="username" required autocomplete="username" placeholder="设备用户名"></div><div class="field"><label for="channel">通道号</label><input id="channel" type="number" min="1" value="1" required></div></div>
<div class="field"><label for="password">密码</label><input id="password" type="text" required autocomplete="off" placeholder="设备密码"></div>
<div class="field" id="time-field" hidden><label for="time">历史时间</label><input id="time" type="datetime-local" step="1"><p class="note">请输入精确到秒的 NVR 设备本地时间；将返回附近最接近的画面。</p></div>
<button class="primary" id="submit" type="submit">获取截图</button><p class="note">设备凭据仅用于本次请求，不保存在浏览器中。</p></form></section>
<section class="panel preview"><div class="preview-head"><div><h2>截图预览</h2><p class="sub">截图完成后可在此查看并保存。</p></div><a class="download" id="download" hidden download="snapshot.jpg">保存图片</a></div><div class="canvas"><div class="empty" id="empty"><div class="icon">▣</div><strong>等待截图</strong><span>填写设备信息后，点击获取截图</span></div><img id="image" alt="监控截图预览" hidden></div><p id="status" class="status" role="status" aria-live="polite">准备就绪</p></section></div></main>
<script>
const form=document.querySelector('#form'), timeField=document.querySelector('#time-field'), timeInput=document.querySelector('#time'), status=document.querySelector('#status'), button=document.querySelector('#submit'), img=document.querySelector('#image'), empty=document.querySelector('#empty'), download=document.querySelector('#download');
let imageUrl='';
form.addEventListener('change',()=>{const history=form.elements.mode.value==='history';timeField.hidden=!history;timeInput.required=history;});
form.addEventListener('submit',async event=>{event.preventDefault();const history=form.elements.mode.value==='history';const body={host:document.querySelector('#host').value.trim(),port:Number(document.querySelector('#port').value),username:document.querySelector('#username').value.trim(),password:document.querySelector('#password').value,channel:Number(document.querySelector('#channel').value)};if(history){body.time=timeInput.value.replace('T',' ');if(body.time.length===16)body.time+=':00';}const headers={'Content-Type':'application/json'};button.disabled=true;button.textContent='正在获取…';status.className='status';status.textContent='正在连接设备并获取截图，请稍候。';try{const response=await fetch('/snapshots',{method:'POST',headers,body:JSON.stringify(body)});if(!response.ok){let message='请求失败（HTTP '+response.status+'）';try{const data=await response.json();if(data.error?.message)message=data.error.message;}catch{}throw new Error(message);}const blob=await response.blob();if(!blob.type.startsWith('image/'))throw new Error('服务返回的内容不是图片');const nextUrl=URL.createObjectURL(blob);if(imageUrl)URL.revokeObjectURL(imageUrl);imageUrl=nextUrl;img.src=imageUrl;img.hidden=false;empty.hidden=true;download.href=imageUrl;download.download='snapshot-ch'+body.channel+'-'+Date.now()+'.jpg';download.hidden=false;const osd=response.headers.get('X-Capture-Osd-Time');const resolution=response.headers.get('X-Capture-Resolution');status.className='status success';status.textContent=(history?'历史截图':'实时截图')+'获取成功'+(osd?' · 设备时间：'+osd:'')+(resolution?' · '+resolution:'');}catch(error){status.className='status error';status.textContent=error.message||'截图失败，请检查设备连接。';}finally{button.disabled=false;button.textContent='获取截图';}});
</script></body></html>
